<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A to Z Finances</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="site-wrapper">

        <header>
            <div class="header-container">
                <img src="logo.jpg" alt="A to Z Finances Logo" class="logo">
            </div>
        </header>

        <img src="logo2.png" alt="Decorative finance graphic" class="bottom-right-img">

        <main>
            <section class="hero">
                <p class="hero-text">
                    Your One Stop Shop For Companies A to Z
                </p>

                <form class="search-bar" role="search">
                    <label for="company-search" class="sr-only">Search company</label>
                    <input
                        id="company-search"
                        type="search"
                        placeholder="Search company name..."
                        required
                    >
                    <button type="submit" aria-label="Search">🔍</button>
                </form>
            </section>

            <section id="results" class="results hidden" aria-live="polite">
                <h2 id="company-name"></h2>
                <ul>
                    <li>Current Assets: <span id="current-assets"></span></li>
                    <li>Current Liabilities: <span id="current-liabilities"></span></li>
                    <li>Inventory: <span id="inventory"></span></li>
                    <li>Total Liabilities: <span id="total-liabilities"></span></li>
                    <li>Shareholder Equity: <span id="equity"></span></li>
                    <li>Total Assets: <span id="total-assets"></span></li>
                </ul>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 A to Z Finances</p>
        </footer>

    </div>

    <script>
        const form = document.querySelector(".search-bar");
        const searchInput = document.getElementById("company-search");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const company = searchInput.value.trim();
            if (!company) return;

            try {
                const response = await fetch(`/api/company?name=${encodeURIComponent(company)}`);
                const data = await response.json();

                document.getElementById("company-name").textContent = data.name;
                document.getElementById("current-assets").textContent = data.currentAssets;
                document.getElementById("current-liabilities").textContent = data.currentLiabilities;
                document.getElementById("inventory").textContent = data.inventory;
                document.getElementById("total-liabilities").textContent = data.totalLiabilities;
                document.getElementById("equity").textContent = data.equity;
                document.getElementById("total-assets").textContent = data.totalAssets;

                document.getElementById("results").classList.remove("hidden");
            } catch (error) {
                console.error("Error fetching company data:", error);
            }
        });
    </script>
</body>
</html>
